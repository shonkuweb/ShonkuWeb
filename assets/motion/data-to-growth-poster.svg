yline points="784,313 784,304" fill="none" stroke="#202d25" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="737,361 727,361" fill="none" stroke="#202d25" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="831,361 841,361" fill="none" stroke="#202d25" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="668" y="483.16" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#202d25">Clarify details.</text><text x="668" y="512.16" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#202d25">Make ordering easier.</text></g><g opacity="1.000"><polyline points="923,400 938,400" fill="none" stroke="#a6b59a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="930,394 938,400 930,406" fill="none" stroke="#c94623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="923" cy="400" r="4" fill="#c94623"><animate attributeName="cx" from="923" to="938" dur="1.8s" begin="4.2s" repeatCount="indefinite"/></circle></g><g opacity="1.000"><rect x="944" y="266" width="274" height="292" rx="11" fill="#d0dac2" stroke="none" stroke-width="1.5"/><rect x="940" y="260" width="274" height="292" rx="11" fill="#dce7bc" stroke="#bec9b1" stroke-width="1.5"/><text x="960" y="290.14" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#68735f">04 / THE GROWTH GOAL</text><circle cx="1076" cy="374" r="57" fill="#dce7bc" stroke="none" stroke-width="1.5"/><polyline points="1029,418 1126,418" fill="none" stroke="#202d25" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="1039" y="391" width="18" height="25" rx="1" fill="#dce7bc" stroke="#202d25" stroke-width="2"/><rect x="1067" y="369" width="18" height="47" rx="1" fill="#dce7bc" stroke="#202d25" stroke-width="2"/><rect x="1095" y="344" width="18" height="72" rx="1" fill="#dce7bc" stroke="#202d25" stroke-width="2"/><polyline points="1032,371 1065,349 1082,357 1119,321" fill="none" stroke="#c94623" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1104,322 1119,321 1119,336" fill="none" stroke="#c94623" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="960" y="483.16" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#202d25">Turn more interest</text><text x="960" y="512.16" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#202d25">into orders.</text></g><g opacity="0.977"><text x="64" y="605.72" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#c94623">Observe. Improve. Learn again.</text><text x="704" y="605.26" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#68735f">Illustrative workflow. Results depend on the business.</text></g></svg>