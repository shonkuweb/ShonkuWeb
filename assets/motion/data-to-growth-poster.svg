<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title"><title id="title">ShonkuWEB: customer signals become business decisions</title><rect width="1280" height="720" fill="#f7f6f2"/><text x="64" y="54.28" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#202d25">ShonkuWEB</text><circle cx="226" cy="43" r="4" fill="#c94623" stroke="none" stroke-width="1.5"/><text x="815" y="49.7" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#68735f">02 / FROM DATA TO DECISIONS</text><polyline points="64,80 1216,80" fill="none" stroke="#d7decd" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="689.48" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#68735f">Built in India. For the world.</text><text x="843" y="689.48" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#68735f">Data-driven stores &amp; systems.</text><polyline points="64,657 1216,657" fill="none" stroke="#d7decd" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="649" width="1152" height="2" rx="0" fill="#dce2d4" stroke="none" stroke-width="1.5"/><rect x="64" y="649" width="624.0" height="2" rx="0" fill="#c94623" stroke="none" stroke-width="1.5"/><text x="64" y="154.12" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#202d25">Every visit tells a story.</text><text x="64" y="206.96" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#c94623">We help you put it to work.</text><g opacity="1.000"><rect x="68" y="266" width="274" height="292" rx="11" fill="#d0dac2" stroke="none" stroke-width="1.5"/><rect x="64" y="260" width="274" height="292" rx="11" fill="#f7f6f2" stroke="#bec9b1" stroke-width="1.5"/><text x="84" y="290.14" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#68735f">01 / CUSTOMER SIGNAL</text><circle cx="200" cy="374" r="57" fill="#dce7bc" stroke="none" stroke-width="1.5"/><rect x="148" y="334" width="104" height="78" rx="8" fill="#f7f6f2" stroke="#202d25" stroke-width="2"/><polyline points="148,354 252,354" fill="none" stroke="#202d25" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="160" cy="344" r="3" fill="#c94623" stroke="none" stroke-width="1.5"/><rect x="161" y="366" width="31" height="33" rx="3" fill="#e3c8a2" stroke="none" stroke-width="1.5"/><rect x="206" y="366" width="31" height="33" rx="3" fill="#819474" stroke="none" stroke-width="1.5"/><text x="84" y="483.16" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#202d25">They revisit the</text><text x="84" y="512.16" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#202d25">same product.</text></g><g opacity="1.000"><polyline points="339,400 354,400" fill="none" stroke="#a6b59a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="346,394 354,400 346,406" fill="none" stroke="#c94623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="339" cy="400" r="4" fill="#c94623"><animate attributeName="cx" from="339" to="354" dur="1.8s" begin="1.5s" repeatCount="indefinite"/></circle></g><g opacity="1.000"><rect x="360" y="266" width="274" height="292" rx="11" fill="#d0dac2" stroke="none" stroke-width="1.5"/><rect x="356" y="260" width="274" height="292" rx="11" fill="#f7f6f2" stroke="#bec9b1" stroke-width="1.5"/><text x="376" y="290.14" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#68735f">02 / USEFUL INSIGHT</text><circle cx="492" cy="374" r="57" fill="#dce7bc" stroke="none" stroke-width="1.5"/><polyline points="445,417 539,417" fill="none" stroke="#202d25" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="453,408 453,377" fill="none" stroke="#202d25" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="478,408 478,343" fill="none" stroke="#202d25" stroke-wid